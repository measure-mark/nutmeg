[project]
name = "nutmeg"
version = "0.1.0"
description = "In-memory graph database backed by Redis"
requires-python = ">=3.14"
dependencies = [
    "redis",
    "fastmcp",
    "httpx",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
# lupa is fakeredis's optional Lua backend -- needed so fakeredis can run
# NutmegGraph's atomic mutation scripts.
dev = ["pytest", "pytest-asyncio", "fakeredis", "lupa"]

[tool.pytest.ini_options]
# The repo is imported with its root on sys.path (`from src...`).
# Without this, pytest only puts tests/ on the path and collection fails.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
