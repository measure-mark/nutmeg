x-app-build: &app-build
  build:
    context: .
    dockerfile_inline: |
      FROM python:3.14-slim
      WORKDIR /app
      COPY pyproject.toml ./
      RUN pip install --no-cache-dir redis fastmcp httpx fastapi uvicorn \
          opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http \
          opentelemetry-instrumentation-fastapi opentelemetry-instrumentation-redis
      COPY src/ ./src/
      COPY main.py mcp_main.py ./
      ENV PYTHONPATH=/app \
          PYTHONUNBUFFERED=1

services:
  redis:
    # TODO, this should be redis 8.10
    image: redis:8-alpine
    # appendonly so the graph survives a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # nba's docker-compose already binds 127.0.0.1:6379 for its own redis, so this
      # one is published on 6380 instead. The container itself still listens on the
      # standard 6379 -- only the host-side port is shifted.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *app-build
    command: ["python", "main.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      API_PORT: "3879"
      # Setting the endpoint is what turns telemetry on -- see src/telemetry.py.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nutmeg
    ports:
      - "127.0.0.1:3879:3879"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3879/docs', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mcp:
    <<: *app-build
    command: ["python", "mcp_main.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      MCP_PORT: "3888"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nutmeg-mcp
    ports:
      - "127.0.0.1:3888:3888"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 3888), timeout=2).close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      # Published so a host-run `python main.py` can export here too.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      # Prometheus scrape endpoint for the metrics pipeline.
      - "127.0.0.1:8889:8889"
    restart: unless-stopped

  otel-gui:
    # Local trace viewer. Serves its OTLP receiver and its UI on the same port,
    # so the standard 4318 is left to the collector and the UI is published on
    # 4320 -- browse http://localhost:4320. Traces are in-memory only.
    image: ghcr.io/metafab/otel-gui:latest
    ports:
      - "127.0.0.1:4320:4318"
    restart: unless-stopped

  test-client-integration:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.14-slim
        WORKDIR /app
        COPY pyproject.toml ./
        RUN pip install --no-cache-dir redis fastmcp httpx fastapi uvicorn pytest pytest-asyncio
        COPY src/ ./src/
        COPY tests/ ./tests/
        ENV PYTHONPATH=/app \
            PYTHONUNBUFFERED=1
    command:
      [
        "python",
        "-m",
        "pytest",
        "tests/test_client_integration.py",
        "tests/test_meta_integration.py",
      ]
    profiles: ["test"]
    environment:
      NUTMEG_LIVE_URL: http://api:3879
      NUTMEG_MCP_URL: http://mcp:3888/mcp
      NUTMEG_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy

volumes:
  redis-data:
