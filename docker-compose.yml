x-app-build: &app-build
  build:
    context: .
    dockerfile_inline: |
      FROM python:3.14-slim
      WORKDIR /app
      COPY pyproject.toml ./
      RUN pip install --no-cache-dir redis fastmcp httpx fastapi uvicorn
      COPY src/ ./src/
      COPY main.py mcp_main.py ./
      ENV PYTHONPATH=/app \
          PYTHONUNBUFFERED=1

services:
  redis:
    # TODO, this should be redis 8.10
    image: redis:8-alpine
    # appendonly so the graph survives a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # nba's docker-compose already binds 127.0.0.1:6379 for its own redis, so this
      # one is published on 6380 instead. The container itself still listens on the
      # standard 6379 -- only the host-side port is shifted.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *app-build
    command: ["python", "main.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      API_PORT: "3879"
    ports:
      - "127.0.0.1:3879:3879"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3879/docs', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mcp:
    <<: *app-build
    command: ["python", "mcp_main.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      MCP_PORT: "3888"
    ports:
      - "127.0.0.1:3888:3888"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  test-client-integration:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.14-slim
        WORKDIR /app
        COPY pyproject.toml ./
        RUN pip install --no-cache-dir redis fastmcp httpx fastapi uvicorn pytest pytest-asyncio
        COPY src/ ./src/
        COPY tests/ ./tests/
        ENV PYTHONPATH=/app \
            PYTHONUNBUFFERED=1
    command: ["python", "-m", "pytest", "tests/test_client_integration.py"]
    profiles: ["test"]
    environment:
      NUTMEG_LIVE_URL: http://api:3879
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  redis-data:
